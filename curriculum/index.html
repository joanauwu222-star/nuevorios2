<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currículum</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffd6e7;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding-top: 30px;
    }

    .contenedor {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      width: 80%;
      max-width: 800px;
      margin-top: 20px;
    }

    img {
      width: auto;
      max-width: 100%;
      height: auto;
      border-radius: 15px;
      display: block;
      margin: 0 auto;
    }

    h1 {
      color: #d63384;
      margin-top: 15px;
      text-align: center;
    }

    p {
      color: #555;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>MI CURRÍCULUM</h1>

  <img src="Curriculum1.jpg" alt="Currículum">

  <div class="contenedor">
    <p>Estudiante Profesional Técnico en Informática
      <br>
      ¡Apasionada por el desarrollo web y la programación, con experiencia creando soluciones digitales!
    </br>
</p>
  </div>

</body>
</html>
