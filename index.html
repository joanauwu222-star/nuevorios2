<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Página Principal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background: #fff0f5;
}

iframe{
    border:none;
    display:block;
}

.menu-frame{
    width:100%;
    height:120px;
}

.contenido-frame{
    width:100%;
    height:calc(100vh - 120px);
}

</style>
</head>

<body>

<iframe src="menu.html" class="menu-frame"></iframe>

<iframe src="contenido.html" name="contenido" class="contenido-frame"></iframe>

</body>
</html>
