    background-repeat: repeat;
    background-size: 500px 500px;
    overflow-x: hidden;
    position: relative;
}

/* CONTENIDO PRINCIPAL */
.contenedor{
    width: 88%;
    margin: auto;
    min-height: 100vh;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 55px;
    position: relative;
    z-index: 2;
}

.texto{
    width: 50%;
    background: rgba(255, 248, 250, 0.82);
    backdrop-filter: blur(12px);
    border-radius: 56px;
    padding: 50px 45px;
    box-shadow: 0 0 20px #ff4fd8, 0 25px 45px rgba(180, 100, 120, 0.12), 0 0 0 1px rgba(255, 200, 215, 0.7) inset, 0 0 0 3px rgba(255, 180, 200, 0.2) inset;
    transition: all 0.35s ease;
    border: 1px solid rgba(255, 190, 210, 0.6);
}

.texto:hover {
    transform: translateY(-5px);
    background: rgba(255, 250, 252, 0.9);
    box-shadow: 0 0 35px #ff4fd8, 0 30px 50px rgba(170, 90, 115, 0.18);
}

.texto h1{
    color: #ff4fd8;
    font-size: 68px;
    margin-bottom: 28px;
    font-weight: 600;
    text-shadow: 0 0 20px #ff4fd8;
    position: relative;
    display: inline-block;
}

.texto p{
    color: #8a526a;
    font-size: 27px;
    line-height: 1.5;
    font-weight: 450;
    text-shadow: 0 1px 0 rgba(255, 240, 245, 0.7);
}

.imagen{
    width: 50%;
    display: flex;
    justify-content: center;
}

.imagen img{
    width: 100%;
    max-width: 620px;
    border-radius: 58px;
    box-shadow: 0 0 30px #ff4fd8;
    border: 3px solid rgba(255, 200, 215, 0.8);
    transition: 0.3s;
}

.imagen img:hover {
    transform: scale(1.01);
    border-color: #ff4fd8;
    box-shadow: 0 0 45px #ff4fd8;
}

</style>
</head>

<body>

<section class="contenedor">

    <div class="texto">

        <h1>Página Principal</h1>

        <p>
            ¡Bienvenido a la página principal! Aquí encontraras la información que necesites.
        </p>

    </div>

    <div class="imagen">

        <img src="https://i.pinimg.com/736x/4c/a5/28/4ca52858b021a1f223f105500c24cb81.jpg">

    </div>

</section>

</body>
