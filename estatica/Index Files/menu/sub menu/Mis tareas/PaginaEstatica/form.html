<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b3b5f 0%, #1a5a7a 50%, #2c8ca8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
        }

        .form-title {
            text-align: center;
            color: #0b3b5f;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #2c8ca8;
            display: inline-block;
            width: 100%;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #0b3b5f;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .form-input {
            padding: 12px 15px;
            border: 2px solid #d0e4ed;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #f8fbfd;
        }

        .form-input:focus {
            outline: none;
            border-color: #2c8ca8;
            box-shadow: 0 0 0 3px rgba(44, 140, 168, 0.2);
            background: white;
        }

        .form-input::placeholder {
            color: #b0c4d4;
            font-size: 0.9rem;
        }

        .form-textarea {
            padding: 12px 15px;
            border: 2px solid #d0e4ed;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
            background: #f8fbfd;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #2c8ca8;
            box-shadow: 0 0 0 3px rgba(44, 140, 168, 0.2);
            background: white;
        }

        .form-textarea::placeholder {
            color: #b0c4d4;
            font-size: 0.9rem;
        }

        .form-button {
            text-align: center;
            margin-top: 10px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0b3b5f 0%, #1a5a7a 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 200px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(11, 59, 95, 0.3);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0c4a6e 0%, #206e8a 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(11, 59, 95, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .form-message {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .form-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .form-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        @media (max-width: 550px) {
            .form-card {
                padding: 25px 20px;
            }
            
            .form-title {
                font-size: 1.6rem;
                margin-bottom: 25px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .btn-submit {
                max-width: 100%;
            }
            
            .form-input, .form-textarea {
                padding: 10px 12px;
            }
        }

        @media (max-width: 380px) {
            .form-card {
                padding: 20px 15px;
            }
            
            .form-title {
                font-size: 1.4rem;
            }
            
            .form-group label {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1 class="form-title">Contactos</h1>
            
            <form id="contactForm" class="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombres">Nombres</label>
                        <input type="text" id="nombres" name="nombres" class="form-input" placeholder="Ingrese sus nombres">
                    </div>
                    
                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" class="form-input" placeholder="Ingrese sus apellidos">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="ex: myname@example.com">
                </div>
                
                <div class="form-group">
                    <label for="telefono">Telefono</label>
                    <input type="tel" id="telefono" name="telefono" class="form-input" placeholder="Ingrese su numero de telefono">
                </div>
                
                <div class="form-group">
                    <label for="mensaje">Escriba su Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" class="form-textarea" rows="5" placeholder="Escriba su mensaje aqui..."></textarea>
                </div>
                
                <div class="form-button">
                    <button type="submit" class="btn-submit">Enviar</button>
                </div>
                
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const nombres = document.getElementById('nombres');
            const apellidos = document.getElementById('apellidos');
            const email = document.getElementById('email');
            const telefono = document.getElementById('telefono');
            const mensaje = document.getElementById('mensaje');
            const formMessage = document.getElementById('formMessage');
            
            let isValid = true;
            let errorMessage = '';
            
            if (!nombres.value.trim()) {
                isValid = false;
                nombres.style.borderColor = '#e74c3c';
                errorMessage = 'Por favor ingrese sus nombres. ';
            } else {
                nombres.style.borderColor = '#d0e4ed';
            }
            
            if (!apellidos.value.trim()) {
                isValid = false;
                apellidos.style.borderColor = '#e74c3c';
                errorMessage += 'Por favor ingrese sus apellidos. ';
            } else {
                apellidos.style.borderColor = '#d0e4ed';
            }
            
            if (!email.value.trim()) {
                isValid = false;
                email.style.borderColor = '#e74c3c';
                errorMessage += 'Por favor ingrese su correo electronico. ';
            } else {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email.value)) {
                    isValid = false;
                    email.style.borderColor = '#e74c3c';
                    errorMessage += 'Ingrese un correo electronico valido. ';
                } else {
                    email.style.borderColor = '#d0e4ed';
                }
            }
            
            if (!telefono.value.trim()) {
                isValid = false;
                telefono.style.borderColor = '#e74c3c';
                errorMessage += 'Por favor ingrese su numero de telefono. ';
            } else {
                telefono.style.borderColor = '#d0e4ed';
            }
            
            if (!mensaje.value.trim()) {
                isValid = false;
                mensaje.style.borderColor = '#e74c3c';
                errorMessage += 'Por favor escriba un mensaje.';
            } else {
                mensaje.style.borderColor = '#d0e4ed';
            }
            
            if (isValid) {
                formMessage.className = 'form-message success';
                formMessage.textContent = 'Mensaje enviado correctamente. Gracias por contactarnos.';
                this.reset();
                
                setTimeout(function() {
                    formMessage.style.display = 'none';
                }, 4000);
            } else {
                formMessage.className = 'form-message error';
                formMessage.textContent = errorMessage;
            }
            
            setTimeout(function() {
                formMessage.style.display = 'none';
            }, 5000);
        });
        
        const inputs = document.querySelectorAll('.form-input, .form-textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#2c8ca8';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value.trim()) {
                    this.style.borderColor = '#d0e4ed';
                }
            });
        });
    </script>
</body>
</html>
